<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5c4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4b896;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="b3" x1="0%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a00;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#3d1a00;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg3)"/>
  <!-- Tall dark bottle -->
  <rect x="230" y="200" width="140" height="380" rx="12" fill="url(#b3)"/>
  <!-- Neck -->
  <rect x="270" y="140" width="60" height="70" rx="6" fill="url(#b3)"/>
  <!-- Atomizer top -->
  <ellipse cx="300" cy="135" rx="35" ry="12" fill="#111"/>
  <rect x="297" y="95" width="6" height="45" fill="#333"/>
  <rect x="280" y="95" width="40" height="8" rx="3" fill="#444"/>
  <!-- Label -->
  <rect x="248" y="320" width="104" height="130" rx="2" fill="rgba(255,255,255,0.08)" stroke="#c8956a" stroke-width="0.8"/>
  <text x="300" y="358" text-anchor="middle" font-family="serif" font-size="10" fill="#c8956a" font-style="italic">Nura Bahar</text>
  <text x="300" y="378" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#d4a870" letter-spacing="3">OUD NOIR</text>
  <line x1="260" y1="390" x2="340" y2="390" stroke="#c8956a" stroke-width="0.5"/>
  <text x="300" y="408" text-anchor="middle" font-family="sans-serif" font-size="7.5" fill="#a08060">Eau de Parfum 30ml</text>
  <!-- Shine -->
  <line x1="244" y1="220" x2="244" y2="560" stroke="rgba(255,255,255,0.12)" stroke-width="4" stroke-linecap="round"/>
  <text x="300" y="730" text-anchor="middle" font-family="serif" font-size="14" fill="#6b3f1f" font-style="italic">Oud Noir</text>
  <text x="300" y="752" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8b6040">Deep · Woody · Sensual</text>
</svg>
