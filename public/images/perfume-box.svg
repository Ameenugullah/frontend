<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c1810;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a2c1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg2)"/>
  <!-- Box -->
  <rect x="150" y="250" width="300" height="200" rx="4" fill="#3d1f0f" stroke="#c8956a" stroke-width="1.5"/>
  <!-- Box top face -->
  <polygon points="150,250 250,190 450,190 350,250" fill="#5a2e12" stroke="#c8956a" stroke-width="1"/>
  <!-- Box right face -->
  <polygon points="450,250 550,190 550,390 450,450" fill="#2e1409" stroke="#c8956a" stroke-width="1"/>
  <!-- Gold ornament -->
  <text x="300" y="360" text-anchor="middle" font-family="serif" font-size="20" fill="#c8956a" font-style="italic">Nura Bahar</text>
  <text x="300" y="385" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#c8956a" letter-spacing="4">NIGERIA</text>
  <!-- Decorative lines -->
  <line x1="175" y1="330" x2="265" y2="330" stroke="#c8956a" stroke-width="0.5"/>
  <line x1="335" y1="330" x2="425" y2="330" stroke="#c8956a" stroke-width="0.5"/>
  <!-- Bottom text -->
  <text x="300" y="680" text-anchor="middle" font-family="serif" font-size="13" fill="#c8956a" font-style="italic">Gift Box Set</text>
  <text x="300" y="700" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8b5e3c">Premium Packaging</text>
</svg>
