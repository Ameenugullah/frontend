<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8bbd0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="b4" x1="0%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" style="stop-color:#e8a0b8;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#c06080;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg4)"/>
  <!-- Curved bottle -->
  <ellipse cx="300" cy="480" rx="90" ry="110" fill="url(#b4)" opacity="0.9"/>
  <rect x="210" y="300" width="180" height="220" rx="0" fill="url(#b4)" opacity="0.85"/>
  <!-- Neck -->
  <rect x="272" y="210" width="56" height="100" rx="6" fill="url(#b4)" opacity="0.9"/>
  <!-- Cap -->
  <rect x="262" y="185" width="76" height="32" rx="5" fill="#a04060"/>
  <!-- Label -->
  <rect x="235" y="330" width="130" height="110" rx="3" fill="rgba(255,255,255,0.5)"/>
  <text x="300" y="367" text-anchor="middle" font-family="serif" font-size="10" fill="#7a2040" font-style="italic">Nura Bahar</text>
  <text x="300" y="387" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#a05070" letter-spacing="2">ROSE &amp; JASMINE</text>
  <line x1="250" y1="398" x2="350" y2="398" stroke="#a05070" stroke-width="0.5"/>
  <text x="300" y="416" text-anchor="middle" font-family="sans-serif" font-size="7.5" fill="#c08090">Floral · Fresh · Feminine</text>
  <!-- Shine -->
  <line x1="224" y1="250" x2="224" y2="570" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round"/>
  <text x="300" y="730" text-anchor="middle" font-family="serif" font-size="14" fill="#a04060" font-style="italic">Rose &amp; Jasmine</text>
  <text x="300" y="752" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#c07090">Light · Romantic · Fresh</text>
</svg>
