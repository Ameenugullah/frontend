<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8c9a0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bottle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8956a;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#8b5e3c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <!-- Bottle body -->
  <rect x="220" y="280" width="160" height="320" rx="20" ry="20" fill="url(#bottle)" opacity="0.85"/>
  <!-- Bottle neck -->
  <rect x="265" y="200" width="70" height="90" rx="8" fill="url(#bottle)" opacity="0.9"/>
  <!-- Bottle cap -->
  <rect x="255" y="170" width="90" height="40" rx="6" fill="#6b3f1f"/>
  <!-- Label -->
  <rect x="240" y="340" width="120" height="120" rx="4" fill="rgba(255,255,255,0.6)"/>
  <text x="300" y="380" text-anchor="middle" font-family="serif" font-size="11" fill="#5a3a1a" font-style="italic">Nura Bahar</text>
  <text x="300" y="400" text-anchor="middle" font-family="serif" font-size="9" fill="#8b5e3c">OUD COLLECTION</text>
  <line x1="260" y1="415" x2="340" y2="415" stroke="#8b5e3c" stroke-width="0.5"/>
  <text x="300" y="435" text-anchor="middle" font-family="serif" font-size="8" fill="#8b5e3c">50ml · Perfume Oil</text>
  <!-- Shimmer lines -->
  <line x1="235" y1="300" x2="235" y2="580" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round"/>
  <!-- Bottom text -->
  <text x="300" y="740" text-anchor="middle" font-family="serif" font-size="14" fill="#8b5e3c" font-style="italic">Perfume Oils</text>
  <text x="300" y="760" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a0795a">Hand-Blended · Long-Lasting</text>
</svg>
